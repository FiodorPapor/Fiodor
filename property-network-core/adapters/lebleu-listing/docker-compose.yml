services:
  preview:
    image: nginx:1.27-alpine
    container_name: lebleu-listing-preview
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.lebleu-preview.rule=Host(`lebleu-preview.srv1636153.hstgr.cloud`)
      - traefik.http.routers.lebleu-preview.entrypoints=websecure
      - traefik.http.routers.lebleu-preview.tls.certresolver=mytlschallenge
      - traefik.http.services.lebleu-preview.loadbalancer.server.port=80
networks:
  web:
    external: true
    name: n8n_default
