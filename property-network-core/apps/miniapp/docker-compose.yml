services:
  app:
    build: .
    container_name: ${CONTAINER_PREFIX:-property-network}-miniapp
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-property-intent-api:8080}
    networks:
      - shared
    labels:
      - traefik.enable=true
      - traefik.docker.network=${SHARED_NETWORK:-n8n_default}
      - traefik.http.routers.${TRAEFIK_ROUTER:-property-network-miniapp}.rule=Host(`${PUBLIC_HOST:-catalog.example.com}`)
      - traefik.http.routers.${TRAEFIK_ROUTER:-property-network-miniapp}.entrypoints=websecure
      - traefik.http.routers.${TRAEFIK_ROUTER:-property-network-miniapp}.tls=true
      - traefik.http.routers.${TRAEFIK_ROUTER:-property-network-miniapp}.tls.certresolver=mytlschallenge
      - traefik.http.routers.${TRAEFIK_ROUTER:-property-network-miniapp}.service=${TRAEFIK_SERVICE:-property-network-miniapp}
      - traefik.http.services.${TRAEFIK_SERVICE:-property-network-miniapp}.loadbalancer.server.port=80

networks:
  shared:
    external: true
    name: ${SHARED_NETWORK:-n8n_default}
