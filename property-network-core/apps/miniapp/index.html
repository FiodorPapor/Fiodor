<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Единый каталог недвижимости в Аргентине" />
  <link rel="icon" href="/app-icon.svg" />
  <link rel="apple-touch-icon" href="/app-icon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Где жить · Недвижимость в Аргентине</title>
  <style>
    html,body,#root{margin:0;min-height:100%;background:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:28px;box-sizing:border-box;text-align:center;color:#15202b}
    .boot strong{display:block;font-size:20px;margin-bottom:8px}
    .boot span{display:block;color:#6b7280;font-size:14px;line-height:1.45}
    .boot button{margin-top:18px;border:0;border-radius:14px;padding:12px 18px;background:#0f6b4f;color:#fff;font-weight:700;font-size:15px}
  </style>
  <script>
    // Vite emits this event when an already-open client requests a hashed chunk
    // removed by a newer deployment. Reload once onto the current release instead
    // of leaving Telegram users on a blank screen.
    window.addEventListener('vite:preloadError', function (event) {
      event.preventDefault();
      try {
        var key = 'property-network:last-preload-reload';
        var now = Date.now();
        var last = Number(sessionStorage.getItem(key) || 0);
        if (now - last < 10000) return;
        sessionStorage.setItem(key, String(now));
      } catch (_) {}
      window.location.reload();
    });
  </script>
  <script src="/telegram-web-app.js?63"></script>
</head>
<body>
  <div id="root"><div class="boot"><div><strong>Где жить</strong><span>Открываем каталог…</span></div></div></div>
  <script>
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    } catch (_) {}
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function(){});
    window.__lebleuBootTimer = window.setTimeout(function () {
      var root = document.getElementById('root');
      if (!root || !root.querySelector('.boot')) return;
      root.innerHTML = '<div class="boot"><div><strong>Не удалось открыть каталог</strong><span>Проверьте соединение и попробуйте ещё раз.</span><button onclick="location.reload()">Повторить</button></div></div>';
    }, 12000);
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
