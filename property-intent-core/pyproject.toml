[project]
name = "property-intent-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "httpx>=0.28",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
