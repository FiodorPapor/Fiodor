services:
  db:
    image: postgres:16-alpine
    container_name: ${CONTAINER_PREFIX:-property-intent}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - property_intent_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [intent]

  api:
    build: .
    container_name: ${CONTAINER_PREFIX:-property-intent}-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${CATALOG_HOST_PATH:-/opt/lebleu-listing-bridge/public/data/full/catalog.json}:/data/catalog.json:ro
      - ${QUALITY_HOST_PATH:-/opt/lebleu-listing-bridge/state/ru-content-quality.json}:/data/quality.json:ro
      - ${GEO_HOST_PATH:-/opt/lebleu-listing-bridge/state/geo-enrichment.json}:/data/geo-enrichment.json:ro
    ports:
      - "127.0.0.1:${HOST_PORT:-8050}:8080"
    networks:
      - intent
      - shared

volumes:
  property_intent_pg:

networks:
  intent:
  shared:
    external: true
    name: ${SHARED_NETWORK:-n8n_default}
