services:
  app:
    build: .
    container_name: lebleu-miniapp
    restart: unless-stopped
    networks:
      - n8n_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.lebleu-miniapp.rule=Host(`lebleu-app.srv1636153.hstgr.cloud`)
      - traefik.http.routers.lebleu-miniapp.entrypoints=websecure
      - traefik.http.routers.lebleu-miniapp.tls=true
      - traefik.http.routers.lebleu-miniapp.tls.certresolver=mytlschallenge
      - traefik.http.services.lebleu-miniapp.loadbalancer.server.port=80

networks:
  n8n_default:
    external: true
