[project]
name = "growth-core"
version = "0.1.0"
description = "CRM-neutral attribution and funnel measurement core for real-estate acquisition."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
